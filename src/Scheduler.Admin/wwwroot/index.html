<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Generic System Scheduler</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:,">
</head>

<body>
    <div id="app">Loading…</div>

    <div id="blazor-error-ui" data-nosnippet>
        Something went wrong in the Admin application. Details are in the log file.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        // Used by the Reports page to print a report (FR-66).
        window.gmssPrint = () => window.print();
        // WP-8d: the printable part of the page with the app's styles, for platforms whose web view cannot print.
        window.gmssPrintableHtml = () => {
            const css = Array.from(document.styleSheets).map(sheet => {
                try { return Array.from(sheet.cssRules).map(rule => rule.cssText).join('\n'); } catch { return ''; }
            }).join('\n');
            const main = document.querySelector('main.content');
            return '<!doctype html><html><head><meta charset="utf-8"><title>' + document.title + '</title><style>' + css +
                '</style></head><body class="print-copy"><main class="content">' + (main ? main.innerHTML : '') + '</main></body></html>';
        };
        // Applies the light or dark theme chosen in the header (FR-63).
        window.gmssSetTheme = theme => document.documentElement.setAttribute('data-theme', theme);
    </script>
</body>

</html>
